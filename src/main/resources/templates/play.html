<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Cut — Play</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1 class="logo">DEEP CUT</h1>
        <p class="tagline">Today's lines, <span th:text="${playerName}"></span>.</p>
    </header>

    <form action="/lock-in" method="post" id="gameForm">
        <div th:each="q, qStat : ${questions}" class="question-block">
            <div class="question-number" th:text="'Q' + ${q.questionNumber}"></div>
            <p class="prompt" th:text="${q.promptText}"></p>
            <div class="answer-wrap">
                <input type="text"
                       th:name="'answer' + ${q.questionNumber}"
                       th:id="'answer' + ${q.questionNumber}"
                       placeholder="Name a player..."
                       autocomplete="off"
                       th:attr="enterkeyhint=${qStat.last} ? 'done' : 'next'"
                       class="answer-input">
                <span class="spell-hint" th:id="'hint' + ${q.questionNumber}"></span>
            </div>
        </div>

        <div class="lock-in-wrap">
            <p class="lock-warning">Once you lock in, your answers are final.</p>
            <button type="button" class="btn-primary btn-lock" id="lockBtn">Lock In</button>

            <div class="confirm-box" id="confirmBox" hidden>
                <p class="confirm-title">Ready to send these to the scout?</p>
                <p class="confirm-detail" id="confirmDetail"></p>
                <button type="submit" class="btn-primary btn-lock" id="confirmBtn">Yes, lock in my answers</button>
                <button type="button" class="btn-ghost" id="keepEditing">Keep editing</button>
            </div>
        </div>
    </form>
</div>

<script>
    const debounce = (fn, ms) => {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    };

    document.querySelectorAll('.answer-input').forEach(input => {
        const number = Number(input.id.replace('answer', ''));
        const hintEl = document.getElementById('hint' + number);

        const checkSpelling = debounce(async (name) => {
            hintEl.textContent = ''; hintEl.className = 'spell-hint'; hintEl.onclick = null;
            if (!name.trim()) return;
            try {
                const res = await fetch('/check-spelling', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, question: number })
                });
                const data = await res.json();
                if (input.value !== name) return; // they kept typing; this answer is stale
                if (data.status === 'corrected' && data.name) {
                    hintEl.textContent = 'Did you mean ' + data.name + '? Tap to use it.';
                    hintEl.className = 'spell-hint suggest';
                    hintEl.onclick = () => { input.value = data.name; hintEl.textContent = ''; hintEl.onclick = null; };
                } else if (data.status === 'exact' && data.name) {
                    hintEl.textContent = '\u2713 ' + data.name;
                    hintEl.className = 'spell-hint ok';
                }
                // Unknown: say nothing. Obscure players are the point of the game; the scout will still check.
            } catch (e) {
                hintEl.textContent = '';
            }
        }, 0);

        // Check once when they leave the box (or tap Next), not on every pause while typing: far fewer calls.
        let lastChecked = '';
        input.addEventListener('change', e => {
            const v = e.target.value.trim();
            if (v === lastChecked) return;
            lastChecked = v;
            checkSpelling(e.target.value);
        });
        input.addEventListener('input', () => { hintEl.textContent = ''; hintEl.onclick = null; lastChecked = ''; });
    });

    const form = document.getElementById('gameForm');
    const inputs = [...document.querySelectorAll('.answer-input')];
    const lockBtn = document.getElementById('lockBtn');
    const confirmBox = document.getElementById('confirmBox');
    const confirmBtn = document.getElementById('confirmBtn');
    let confirmed = false;

    // Enter (or "Go"/"Next" on a phone keyboard) moves to the next answer instead of submitting.
    inputs.forEach((input, i) => {
        input.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            if (i + 1 < inputs.length) inputs[i + 1].focus();
            else input.blur();
        });
        input.addEventListener('input', () => { if (!confirmBox.hidden) closeConfirm(); });
    });

    // Step 1: Lock In opens a check showing how many are answered.
    lockBtn.addEventListener('click', () => {
        const answered = inputs.filter(x => x.value.trim()).length;
        const total = inputs.length;
        document.getElementById('confirmDetail').textContent = answered === total
            ? 'All ' + total + ' answered. Your answers are final once you lock in.'
            : "You've answered " + answered + ' of ' + total + '. Skipped questions score 0.';
        lockBtn.hidden = true;
        confirmBox.hidden = false;
        confirmBtn.focus();
        confirmBox.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });

    function closeConfirm() {
        confirmBox.hidden = true;
        lockBtn.hidden = false;
    }
    document.getElementById('keepEditing').addEventListener('click', closeConfirm);

    // Step 2: only the final button sends the answers.
    confirmBtn.addEventListener('click', () => { confirmed = true; });
    form.addEventListener('submit', e => {
        if (!confirmed) { e.preventDefault(); return; }
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Sending to the scout...';
        document.getElementById('keepEditing').hidden = true;
    });
</script>
</body>
</html>
