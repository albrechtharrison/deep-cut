<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Cut — Play</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1 class="logo">DEEP CUT</h1>
        <p class="tagline">Today's lines, <span th:text="${playerName}"></span>.</p>
    </header>

    <form action="/lock-in" method="post" id="gameForm">
        <div th:each="q : ${questions}" class="question-block">
            <div class="question-number" th:text="'Q' + ${q.questionNumber}"></div>
            <p class="prompt" th:text="${q.promptText}"></p>
            <div class="answer-wrap">
                <input type="text"
                       th:name="'answer' + ${q.questionNumber}"
                       th:id="'answer' + ${q.questionNumber}"
                       placeholder="Name a player..."
                       autocomplete="off"
                       class="answer-input">
                <span class="spell-hint" th:id="'hint' + ${q.questionNumber}"></span>
            </div>
        </div>

        <div class="lock-in-wrap">
            <p class="lock-warning">Once you lock in, your answers are final.</p>
            <button type="submit" class="btn-primary btn-lock" id="lockBtn">Lock In</button>
        </div>
    </form>
</div>

<script>
    const debounce = (fn, ms) => {
        let t;
        return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    };

    document.querySelectorAll('.answer-input').forEach(input => {
        const number = Number(input.id.replace('answer', ''));
        const hintEl = document.getElementById('hint' + number);

        const checkSpelling = debounce(async (name) => {
            hintEl.textContent = ''; hintEl.className = 'spell-hint'; hintEl.onclick = null;
            if (!name.trim()) return;
            try {
                const res = await fetch('/check-spelling', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, question: number })
                });
                const data = await res.json();
                if (input.value !== name) return; // they kept typing; this answer is stale
                if (data.status === 'corrected' && data.name) {
                    hintEl.textContent = 'Did you mean ' + data.name + '? Tap to use it.';
                    hintEl.className = 'spell-hint suggest';
                    hintEl.onclick = () => { input.value = data.name; hintEl.textContent = ''; hintEl.onclick = null; };
                } else if (data.status === 'exact' && data.name) {
                    hintEl.textContent = '\u2713 ' + data.name;
                    hintEl.className = 'spell-hint ok';
                }
                // Unknown: say nothing. Obscure players are the point of the game; the scout will still check.
            } catch (e) {
                hintEl.textContent = '';
            }
        }, 700);

        input.addEventListener('input', e => checkSpelling(e.target.value));
    });

    document.getElementById('gameForm').addEventListener('submit', () => {
        const btn = document.getElementById('lockBtn');
        btn.disabled = true;
        btn.textContent = 'Sending to the scout...';
    });
</script>
</body>
</html>
