<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Cut — All-Time Leaderboard</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <header>
        <h1 class="logo">DEEP CUT</h1>
        <p class="tagline">All-time leaderboard</p>
        <p class="tagline small">Ranked by total points. Rank titles use each player's average day.</p>
    </header>

    <div class="ladder">
        <div th:if="${entries.isEmpty()}" class="empty-ladder">
            <p>No one has finished a round yet.</p>
        </div>

        <div th:each="entry, stat : ${entries}" class="ladder-row"
             th:classappend="${stat.index == 0} ? ' top-dog' : ''">
            <span class="rank" th:text="${stat.index + 1}"></span>
            <span class="ladder-name">
                <span th:text="${entry.name}"></span>
                <span class="rank-chip" th:text="${entry.rank}"></span>
                <span class="ladder-stats"
                      th:text="${entry.days} + (${entry.days} == 1 ? ' day' : ' days') + ' · avg ' + ${entry.avg} + ' · best ' + ${entry.best} + (${entry.wins} > 0 ? ' · ' + ${entry.wins} + (${entry.wins} == 1 ? ' daily win' : ' daily wins') : '') + (${entry.streak} > 1 ? ' · 🔥 ' + ${entry.streak} + '-day streak' : '')"></span>
            </span>
            <span class="ladder-score" th:text="${entry.total} + ' pts'"></span>
        </div>
    </div>

    <nav class="nav-links">
        <a href="/ladder">Today's ladder</a>
        <a href="/">Play today</a>
    </nav>
</div>
</body>
</html>
